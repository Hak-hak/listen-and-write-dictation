<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listen and Spell: Grammar Practice</title>
    <meta
      name="description"
      content="An interactive application for Vietnamese speakers to practice English listening and spelling, create custom sentence sets on Firestore, and share practice links."
    />
    <meta property="og:title" content="Listen and Spell: Grammar Practice" />
    <meta
      property="og:description"
      content="Practice English listening and spelling with built-in grammar topics or create and share your own custom sentence sets."
    />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return originalFetch;
            },
            set: function (val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>Bạn cần bật JavaScript để chạy ứng dụng này.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
